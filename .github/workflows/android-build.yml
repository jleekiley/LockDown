name: Android Build (APK)

on:
  workflow_call:
    inputs:
      build_type:
        description: "APK build type (debug, release, or both)"
        required: false
        type: string
        default: "both"
      version_tag:
        description: "Optional version tag prefix for APK filenames"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "GitHub Actions artifact name"
        required: false
        type: string
        default: "LockDown-android-apk"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type (debug = dev client, release = standalone)"
        required: false
        type: choice
        options:
          - debug
          - release
          - both
        default: debug
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.json"
      - "modules/**"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK(s)
        working-directory: android
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          chmod +x gradlew
          TASKS=""
          ARCHS="arm64-v8a"
          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "both" ]; then
            TASKS="$TASKS assembleDebug"
          fi
          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "both" ]; then
            TASKS="$TASKS assembleRelease"
            ARCHS="armeabi-v7a,arm64-v8a"
          fi
          ./gradlew $TASKS \
            -PreactNativeArchitectures="$ARCHS" \
            --build-cache \
            --no-daemon

      - name: Collect APK outputs
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          mkdir -p build/apk
          PREFIX="LockDown"
          if [ -n "$VERSION_TAG" ]; then
            PREFIX="LockDown-${VERSION_TAG}"
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "build/apk/${PREFIX}-android-dev.apk"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "build/apk/${PREFIX}-android-release.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'LockDown-android-apk' }}
          path: build/apk/*.apk
          retention-days: 14
